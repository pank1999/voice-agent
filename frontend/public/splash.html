<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        width: 400px;
        height: 300px;
        background: linear-gradient(
          135deg,
          #020917 0%,
          #0a1628 50%,
          #080d1f 100%
        );
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        overflow: hidden;
      }
      .orb {
        width: 80px;
        height: 80px;
        border-radius: 50%;
        background: radial-gradient(circle at 35% 35%, #67e8f9, #0891b2);
        box-shadow:
          0 0 40px rgba(34, 211, 238, 0.5),
          0 0 80px rgba(34, 211, 238, 0.2);
        animation: pulse 2s ease-in-out infinite;
        margin-bottom: 24px;
      }
      @keyframes pulse {
        0%,
        100% {
          transform: scale(1);
          opacity: 1;
        }
        50% {
          transform: scale(1.05);
          opacity: 0.9;
        }
      }
      .title {
        color: #22d3ee;
        font-size: 24px;
        font-weight: 300;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        margin-bottom: 8px;
      }
      .subtitle {
        color: rgba(100, 116, 139, 0.8);
        font-size: 11px;
        letter-spacing: 0.15em;
        text-transform: uppercase;
      }
      .loading {
        margin-top: 32px;
        display: flex;
        gap: 4px;
      }
      .dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #22d3ee;
        animation: bounce 0.6s ease-in-out infinite;
      }
      .dot:nth-child(2) {
        animation-delay: 0.1s;
      }
      .dot:nth-child(3) {
        animation-delay: 0.2s;
      }
      @keyframes bounce {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-8px);
        }
      }
      .status {
        margin-top: 16px;
        color: rgba(148, 163, 184, 0.6);
        font-size: 11px;
        font-family: "SF Mono", Monaco, monospace;
        letter-spacing: 0.05em;
        height: 16px;
      }
      .status.ready {
        color: #4ade80;
      }
      .status.error {
        color: #ef4444;
      }
    </style>
  </head>
  <body>
    <div class="orb"></div>
    <div class="title">J.A.R.V.I.S</div>
    <div class="subtitle">Initializing Systems</div>
    <div class="loading">
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
    </div>
    <div class="status" id="status">Starting backend...</div>

    <script>
      const { ipcRenderer } = require("electron");
      const statusEl = document.getElementById("status");

      ipcRenderer.on("backend-status", (event, status) => {
        statusEl.textContent = status.message;
        statusEl.className = "status " + (status.type || "");
      });
    </script>
  </body>
</html>
