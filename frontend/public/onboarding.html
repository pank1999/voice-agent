<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JARVIS - Setup</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 500px;
      height: 400px;
      background: linear-gradient(135deg, #020917 0%, #0a1628 50%, #080d1f 100%);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px;
    }
    .orb {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #67e8f9, #0891b2);
      box-shadow: 0 0 30px rgba(34, 211, 238, 0.5);
      margin-bottom: 24px;
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.05); opacity: 0.9; }
    }
    h1 {
      font-size: 24px;
      font-weight: 300;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #22d3ee;
      margin-bottom: 8px;
    }
    .subtitle {
      color: rgba(100, 116, 139, 0.8);
      font-size: 13px;
      margin-bottom: 32px;
    }
    .form-group {
      width: 100%;
      margin-bottom: 20px;
    }
    label {
      display: block;
      font-size: 12px;
      color: rgba(148, 163, 184, 0.8);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 8px;
    }
    input {
      width: 100%;
      padding: 12px 16px;
      background: rgba(34, 211, 238, 0.05);
      border: 1px solid rgba(34, 211, 238, 0.2);
      border-radius: 8px;
      color: #fff;
      font-size: 14px;
      outline: none;
      transition: all 0.2s;
    }
    input:focus {
      border-color: rgba(34, 211, 238, 0.5);
      background: rgba(34, 211, 238, 0.08);
    }
    input::placeholder {
      color: rgba(100, 116, 139, 0.5);
    }
    .hint {
      font-size: 11px;
      color: rgba(100, 116, 139, 0.6);
      margin-top: 6px;
    }
    .hint a {
      color: #22d3ee;
      text-decoration: none;
    }
    button {
      width: 100%;
      padding: 14px 24px;
      margin-top: 16px;
      background: linear-gradient(135deg, #0891b2 0%, #0e7490 100%);
      border: none;
      border-radius: 8px;
      color: #fff;
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.2s;
    }
    button:hover {
      background: linear-gradient(135deg, #0e7490 0%, #0891b2 100%);
      box-shadow: 0 0 20px rgba(34, 211, 238, 0.3);
    }
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .error {
      color: #ef4444;
      font-size: 12px;
      margin-top: 8px;
      display: none;
    }
    .success {
      text-align: center;
    }
    .success .orb {
      animation: none;
      box-shadow: 0 0 40px rgba(34, 211, 238, 0.8);
    }
    .success h2 {
      color: #22d3ee;
      font-weight: 300;
      margin-bottom: 8px;
    }
    .success p {
      color: rgba(148, 163, 184, 0.8);
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div id="setup-form">
    <div class="orb"></div>
    <h1>J.A.R.V.I.S</h1>
    <p class="subtitle">Just A Rather Very Intelligent System</p>

    <div class="form-group">
      <label>OpenAI API Key</label>
      <input type="password" id="apiKey" placeholder="sk-..." />
      <p class="hint">
        Required for voice recognition and AI responses.
        <a href="https://platform.openai.com/api-keys" target="_blank">Get your key</a>
      </p>
    </div>

    <div id="error" class="error">Please enter a valid API key</div>

    <button id="saveBtn" onclick="saveConfig()">Initialize JARVIS</button>
  </div>

  <div id="success" class="success" style="display: none;">
    <div class="orb"></div>
    <h2>Systems Online</h2>
    <p>JARVIS is ready. Opening main interface...</p>
  </div>

  <script>
    const { ipcRenderer } = require('electron');

    function saveConfig() {
      const apiKey = document.getElementById('apiKey').value.trim();
      const errorEl = document.getElementById('error');
      const btn = document.getElementById('saveBtn');

      if (!apiKey || !apiKey.startsWith('sk-')) {
        errorEl.style.display = 'block';
        return;
      }

      errorEl.style.display = 'none';
      btn.disabled = true;
      btn.textContent = 'Initializing...';

      ipcRenderer.send('save-config', { openaiApiKey: apiKey });
    }

    ipcRenderer.on('config-saved', () => {
      document.getElementById('setup-form').style.display = 'none';
      document.getElementById('success').style.display = 'block';
    });

    ipcRenderer.on('config-error', (event, message) => {
      const errorEl = document.getElementById('error');
      const btn = document.getElementById('saveBtn');
      errorEl.textContent = message;
      errorEl.style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'Initialize JARVIS';
    });

    // Allow Enter key to submit
    document.getElementById('apiKey').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') saveConfig();
    });
  </script>
</body>
</html>
