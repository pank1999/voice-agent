name: Build and Release JARVIS Desktop App

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt
          # Verify key dependencies are installed
          python -c "import fastapi; print('fastapi:', fastapi.__version__)"
          python -c "import uvicorn; print('uvicorn:', uvicorn.__version__)"

      - name: Build Python backend binary
        run: |
          pyinstaller backend.spec --clean --noconfirm
          ls -la dist/
          # Verify the binary was created and check its contents
          ls -la dist/jarvis-backend || (echo "Backend binary not found!" && exit 1)

      - name: Test backend binary
        run: |
          # Quick test to ensure binary works
          timeout 5 ./dist/jarvis-backend &
          sleep 2
          curl -s http://127.0.0.1:8000/health || echo "Health check failed - binary may be missing dependencies"
          pkill jarvis-backend || true

      - name: Install Node dependencies
        working-directory: frontend
        run: npm install

      - name: Build Electron app
        working-directory: frontend
        run: npm run electron:build:ci
        env:
          GH_TOKEN: ${{ secrets.GH_WORKFLOW_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-dist
          path: dist-electron/*.dmg

      - name: Create Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist-electron/*.dmg
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GH_WORKFLOW_TOKEN }}
